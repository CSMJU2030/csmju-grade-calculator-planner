# .standards-version is the authoritative standards pin (currently 1.8.4).
# Production origin assigned by PL; local development uses frontend 3214 / backend 4214.
name: csmju-grade-calculator-planner
conformance_level: L3
base_url: https://csmju-grade-calculator-planner.jowave.com
core_hub_url: https://csmju2030.jowave.com
core_hub_web_url: https://csmju2030.jowave.com
callback_path: /auth/callback

public_endpoints:
  - GET /api/health
  - GET /auth/login
  - GET /auth/callback
  - POST /auth/logout

probes:
  collection: /api/v1/courses
  not_found: /api/v1/courses/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/courses/not-a-uuid
  create:
    path: /api/v1/courses
    allowed_role: staff
    denied_role: alumni
    invalid_body:
      courseCode: "TEST-CONFORMANCE"
      courseName: "ทดสอบ validation"
      credits: 0
    valid_body:
      courseCode: "TEST-CONFORMANCE"
      courseName: "รายวิชาสำหรับทดสอบ conformance"
      credits: 3

owners:
  pl: "@csmju2030/pl-grade-calculator-planner"
  aie: "@csmju2030/aie-grade-calculator-planner"
display_name: "ระบบคำนวณเกรด"
repo: github.com/CSMJU2030/csmju-grade-calculator-planner
status: proposed

# Temporary composition permitted by ui-design-system §17.0 / §20.1.
ui:
  local_components:
    - PageStates
    - ErrorNotice
    - CourseForm
    - TaskEstimator
    - formatNumber
